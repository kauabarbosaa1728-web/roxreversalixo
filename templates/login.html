{% extends 'base.html' %}

{% block content %}
<style>
  body {
    min-height: 100vh;
    background-color: #071f32;
    background-image:
      linear-gradient(
        rgba(4, 20, 34, 0.15),
        rgba(4, 20, 34, 0.30)
      ),
      url("{{ url_for('login_background') }}");
    background-size: cover;
    background-position: center;
    background-repeat: no-repeat;
    background-attachment: fixed;
  }

  header {
    background: rgba(10, 35, 51, 0.90);
  }

  .panel.login {
    max-width: 430px;
    margin: 55px auto;
    padding: 30px;
    background: rgba(255, 255, 255, 0.96);
    border: 1px solid rgba(255, 255, 255, 0.65);
    border-radius: 16px;
    box-shadow: 0 18px 50px rgba(0, 0, 0, 0.30);
  }

  .login h1 {
    margin-top: 0;
  }

  .login input {
    background: #f8fafc;
  }

  .login input:focus {
    outline: 2px solid #087d72;
    outline-offset: 2px;
  }

  .login button {
    width: 100%;
    font-weight: 600;
  }

  @media (max-width: 600px) {
    body {
      min-height: 100dvh;
      background-attachment: scroll;
      background-position: center top;
    }

    .panel.login {
      width: 100%;
      max-width: 430px;
      margin: 24px auto;
      padding: 24px 22px;
      border-radius: 18px;
    }

    .login h1 {
      font-size: 25px;
      line-height: 1.2;
      margin-bottom: 12px;
    }

    .login .muted {
      font-size: 14px;
      line-height: 1.5;
      margin-bottom: 22px;
    }

    .login label {
      font-size: 14px;
      margin-bottom: 8px;
    }

    .login input {
      font-size: 16px;
      min-height: 50px;
      padding: 13px 14px;
      border-radius: 10px;
    }

    .login .actions {
      margin: 22px 0 0;
    }

    .login button {
      min-height: 50px;
      border-radius: 10px;
    }
  }

  @media (max-width: 360px) {
    .panel.login {
      padding: 22px 18px;
    }

    .login h1 {
      font-size: 23px;
    }
  }
</style>

<div class="panel login">
  <h1>Reversa e Lixo Eletrônico</h1>

  <p class="muted">
    Gestão de equipamentos, reaproveitamento e reciclagem.
  </p>

  <form method="post">
    <input type="hidden" name="csrf" value="{{ csrf }}">

    <label for="username">Usuário</label>
    <input
      id="username"
      name="username"
      autocomplete="username"
      autocapitalize="none"
      spellcheck="false"
      placeholder="Digite seu usuário"
      required
    >

    <br><br>

    <label for="password">Senha</label>
    <input
      id="password"
      type="password"
      name="password"
      autocomplete="current-password"
      placeholder="Digite sua senha"
      required
    >

    <div class="actions">
      <button type="submit">Entrar</button>
    </div>
  </form>
</div>
{% endblock %}
