<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1, viewport-fit=cover"
  >

  <title>Reversa e Lixo Eletrônico</title>

  <meta name="theme-color" content="#102d40">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="Reversa">
  <meta
    name="apple-mobile-web-app-status-bar-style"
    content="default"
  >

  <link
    rel="manifest"
    href="{{ url_for('pwa_manifest') }}"
  >

  <link
    rel="apple-touch-icon"
    sizes="180x180"
    href="{{ url_for('pwa_icon', size=180) }}"
  >

  <link
    rel="icon"
    type="image/png"
    sizes="192x192"
    href="{{ url_for('pwa_icon', size=192) }}"
  >

  <style>
    * { box-sizing: border-box; }

    [hidden] { display: none !important; }

    body {
      margin: 0;
      font: 16px system-ui;
      background: #f1f5f9;
      color: #172337;
      min-height: 100vh;
      min-height: 100dvh;
      padding-bottom: env(safe-area-inset-bottom);
    }

    header {
      background: #102d40;
      color: white;
      padding: 22px max(20px, calc((100vw - 1200px)/2));
      padding-top: calc(22px + env(safe-area-inset-top));
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 20px;
      flex-wrap: wrap;
    }

    header a { color: white; }

    .header-actions {
      display: flex;
      align-items: center;
      gap: 16px;
      flex-wrap: wrap;
    }

    .header-actions form { margin: 0; }

    main {
      max-width: 1200px;
      margin: 30px auto;
      padding: 0 20px;
    }

    a {
      color: #087d72;
      text-decoration: none;
    }

    h1 {
      font-size: 28px;
      overflow-wrap: anywhere;
    }

    h2 { font-size: 20px; }

    .panel, .card {
      background: white;
      border: 1px solid #dbe4e9;
      border-radius: 14px;
      padding: 22px;
      margin-bottom: 20px;
    }

    .cards {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(145px, 1fr));
      gap: 12px;
    }

    .card strong {
      display: block;
      font-size: 30px;
      margin-top: 8px;
    }

    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(240px, 1fr));
      gap: 18px;
    }

    label {
      display: block;
      font-weight: 600;
      margin-bottom: 7px;
    }

    input, select, textarea {
      font: inherit;
      width: 100%;
      padding: 12px;
      border: 1px solid #bac8d1;
      border-radius: 8px;
    }

    textarea { min-height: 95px; }

    button, .button {
      font: inherit;
      display: inline-block;
      background: #087d72;
      border: 0;
      border-radius: 8px;
      color: white;
      padding: 12px 18px;
      cursor: pointer;
      min-height: 44px;
    }

    .danger { background: #b42318; }

    .actions {
      display: flex;
      gap: 12px;
      align-items: center;
      flex-wrap: wrap;
      margin: 18px 0;
    }

    .message {
      background: #fff4cd;
      color: #172337;
      padding: 15px;
      border-radius: 8px;
      margin-bottom: 15px;
      overflow-wrap: anywhere;
    }

    .table { overflow-x: auto; }

    table {
      width: 100%;
      border-collapse: collapse;
    }

    td, th {
      text-align: left;
      padding: 13px 10px;
      border-bottom: 1px solid #e1e8ed;
      overflow-wrap: anywhere;
    }

    th {
      font-size: 13px;
      color: #546878;
    }

    .badge {
      background: #e3f3ed;
      padding: 5px 9px;
      border-radius: 6px;
      white-space: nowrap;
    }

    .muted {
      color: #5a6b7d;
      font-size: 14px;
    }

    .event {
      border-left: 3px solid #087d72;
      padding: 0 16px;
      margin: 22px 0;
      white-space: pre-wrap;
    }

    .login {
      max-width: 430px;
      margin: 55px auto;
    }

    p { overflow-wrap: anywhere; }

    .filters {
      display: flex;
      gap: 12px;
      flex-wrap: wrap;
    }

    .filters input {
      flex: 2;
      min-width: 180px;
    }

    .filters select {
      flex: 1;
      min-width: 160px;
    }

    #install-app {
      background: #ffffff;
      color: #102d40;
      font-weight: 600;
    }

    @media (max-width: 600px) {
      main {
        padding: 0 14px;
        margin: 20px auto;
      }

      .grid {
        grid-template-columns: 1fr;
      }

      .panel {
        padding: 18px;
      }

      .header-actions {
        gap: 12px;
      }

      .cards {
        grid-template-columns: repeat(2, minmax(0, 1fr));
      }

      .filters input,
      .filters select {
        min-width: 0;
        flex-basis: 100%;
      }
    }
  </style>

  <script
    src="{{ url_for('pwa_script') }}"
    defer
  ></script>
</head>

<body>
  <header>
    <div>
      <b>↻ REVERSA</b>
      <div style="font-size:13px">
        Roteadores e lixo eletrônico · KBSISTEMAS
      </div>
    </div>

    <div class="header-actions">
      <button
        id="install-app"
        type="button"
        hidden
        aria-controls="install-help"
      >
        Instalar aplicativo
      </button>

      {% if session.user_id %}
        <a href="{{ url_for('index') }}">Início</a>

        {% if is_admin %}
          <a href="{{ url_for('users') }}">Usuários</a>
        {% endif %}

        <span>
          {{ session.username }}
          {% if is_admin %} · Admin{% endif %}
        </span>

        <form method="post" action="{{ url_for('logout') }}">
          <input type="hidden" name="csrf" value="{{ csrf }}">
          <button>Sair</button>
        </form>
      {% endif %}
    </div>
  </header>

  <main>
    <div
      id="install-help"
      class="message"
      role="status"
      hidden
    ></div>

    {% for message in get_flashed_messages() %}
      <div class="message">{{ message }}</div>
    {% endfor %}

    {% block content %}{% endblock %}
  </main>
</body>
</html>
